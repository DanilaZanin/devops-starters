name: lakehouse-trino-iceberg

services:
  s3:
    # S3-compatible object store. MinIO stopped publishing community images to Docker
    # Hub (the old minio/minio release tags no longer pull), so this uses RustFS, an
    # actively released Apache-2.0 S3 server. See "Local demo vs production" in the README.
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12

  bucket-init:
    image: amazon/aws-cli:2.37.6
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - aws --endpoint-url http://s3:9000 s3api head-bucket --bucket warehouse 2>/dev/null || aws --endpoint-url http://s3:9000 s3api create-bucket --bucket warehouse

  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      bucket-init:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://s3:9000
      CATALOG_S3_ACCESS__KEY__ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      CATALOG_S3_SECRET__ACCESS__KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_REGION: us-east-1
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      # Lists namespaces: a real catalog operation, not just "the port is open".
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8181/v1/namespaces > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  trino:
    build:
      context: .
      dockerfile: trino/Dockerfile
    depends_on:
      iceberg-rest:
        condition: service_healthy
    environment:
      # Referenced from iceberg.properties as ${ENV:...}, so no credential is
      # written into a file that gets committed.
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # `SELECT 1` only proves the server is up: Trino reads the REST catalog lazily.
      # Listing the schemas of the iceberg catalog goes through the catalog to the
      # object store setup, so "healthy" means "can create and read tables".
      test: ["CMD-SHELL", "trino --execute 'SHOW SCHEMAS FROM iceberg' > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 30
      start_period: 30s

volumes:
  s3-data:
