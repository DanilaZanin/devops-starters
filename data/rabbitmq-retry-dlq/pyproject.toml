[project]
name = "rabbitmq-retry-dlq"
version = "0.1.0"
description = "RabbitMQ consumer example: TTL retry queue, dead-letter queue, poison-message handling, publisher confirms"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (the Docker image installs from that file).
dependencies = ["pika==1.4.4"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
