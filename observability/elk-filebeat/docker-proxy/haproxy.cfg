# Read-only allowlist for Filebeat's docker autodiscover. Anything not listed gets 403:
# every non-GET method, websocket/connection upgrades (attach/ws), /logs, /exec,
# /archive, /export, /images, /volumes ...
global
    log stdout format raw daemon info
    maxconn 200

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout http-request 10s
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    errorfile 403 /usr/local/etc/haproxy/errors/403.http

backend dockerbackend
    server dockersocket /var/run/docker.sock

backend docker-events
    server dockersocket /var/run/docker.sock
    timeout server 0

frontend dockerfrontend
    bind :2375
    http-request deny unless METH_GET
    http-request deny if { hdr_cnt(Upgrade) gt 0 }
    http-request deny if { hdr_cnt(Connection) gt 0 } { hdr(Connection) -m sub -i upgrade }
    acl allowed path,url_dec -m reg -i ^(/v[0-9.]+)?/(version|info|_ping|events|containers/json)$
    acl allowed path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-z0-9][a-z0-9_.-]*/json$
    http-request deny unless allowed
    use_backend docker-events if { path,url_dec -m reg -i ^(/v[0-9.]+)?/events$ }
    default_backend dockerbackend
