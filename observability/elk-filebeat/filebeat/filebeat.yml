# Opt-in log collection: only containers that carry the label
#   co.elastic.logs/enabled: "true"
# are shipped. Everything else on the host is left alone.
filebeat.autodiscover:
  providers:
    - type: docker
      # docker-proxy allows read-only calls only; there is no Docker socket in this container.
      host: "tcp://docker-proxy:2375"
      hints.enabled: true
      hints.default_config:
        # This line is what makes collection opt-in. Without it, default_config is
        # applied to EVERY container (Elasticsearch, Kibana, Filebeat itself, and
        # anything else on the host), and the label changes nothing.
        enabled: false
        type: filestream
        # Filestream needs a unique id per input. The `container` input of older
        # Filebeat versions is gone in 9.x.
        id: container-${data.container.id}
        parsers:
          - container: ~
        paths:
          - /var/lib/docker/containers/${data.container.id}/*.log

processors:
  - add_docker_metadata:
      host: "tcp://docker-proxy:2375"

# The index template and the ILM policy are created by the `setup` service, so
# Filebeat only needs permission to write documents.
setup.ilm.enabled: false
setup.template.enabled: false
setup.template.name: "app-logs"
setup.template.pattern: "app-logs-*"

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  username: filebeat_writer
  password: "${FILEBEAT_PASSWORD}"
  index: "app-logs-%{+yyyy.MM.dd}"

logging.level: info
