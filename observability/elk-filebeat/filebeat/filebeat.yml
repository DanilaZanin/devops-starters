filebeat.autodiscover:
  providers:
    - type: docker
      # opt-in: only containers carrying this label get collected, so
      # attaching this stack to an existing docker-compose project doesn't
      # suddenly vacuum up every container's logs on the host - just add
      # the label to the services you actually want shipped.
      #
      # (tried filebeat's hints.enabled + label mechanism first - it has a
      # version-specific bug where the *implicit* per-container template
      # fails to resolve "data.container.id" and silently drops the input,
      # and worse, once you work around that with hints.default_config, that
      # default gets applied to every container regardless of the label,
      # defeating the whole point. `templates` + `condition` below is the
      # documented, reliable way to do conditional collection.)
      templates:
        - condition:
            equals:
              docker.container.labels.enable_logging: "true"
          config:
            - type: container
              paths:
                - "/var/lib/docker/containers/${data.container.id}/*.log"

processors:
  - add_docker_metadata: ~

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "app-logs-%{+yyyy.MM.dd}"

setup.template.name: "app-logs"
setup.template.pattern: "app-logs-*"
setup.ilm.enabled: false

logging.level: debug
logging.selectors: ["autodiscover"]
logging.to_stderr: true
