name: elk-filebeat

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      xpack.security.enabled: "true"
      # Demo shortcut: HTTP and transport TLS are off, so passwords cross the
      # docker network in clear text. Fine on one host, not on a shared network.
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u \"elastic:$${ELASTIC_PASSWORD}\" \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # One-shot: ILM policy (7 day retention), index template, the kibana_system password
  # and a least-privilege user for Filebeat. Safe to run again.
  setup:
    build:
      context: .
      dockerfile: setup/Dockerfile
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
      FILEBEAT_PASSWORD: ${FILEBEAT_PASSWORD:?set FILEBEAT_PASSWORD in .env}
    entrypoint: ["bash", "/setup.sh"]

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  filebeat:
    build:
      context: .
      dockerfile: filebeat/Dockerfile
      args:
        # Lets the smoke test build the broken config.
        FILEBEAT_CONFIG: ${FILEBEAT_CONFIG:-filebeat/filebeat.yml}
    # Root is required to read other containers' log files under /var/lib/docker.
    # Filebeat does NOT get the Docker socket: it asks docker-proxy (below) for
    # container metadata and events, and nothing else.
    user: root
    depends_on:
      setup:
        condition: service_completed_successfully
      docker-proxy:
        condition: service_healthy
    environment:
      FILEBEAT_PASSWORD: ${FILEBEAT_PASSWORD:?set FILEBEAT_PASSWORD in .env}
    networks:
      - default
      - docker-api
    volumes:
      - filebeat-data:/usr/share/filebeat/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    healthcheck:
      test: ["CMD-SHELL", "filebeat test output > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # The only container that touches the Docker socket. HAProxy in front of it answers
  # GET requests for containers, events, info, ping and version and refuses everything else
  # (POST is off), so a compromised Filebeat cannot create, kill or exec anything.
  # It sits on an internal network shared with Filebeat only.
  # Note: read access to /containers still exposes every container's environment
  # (`docker inspect`), see the README.
  docker-proxy:
    # Pinned by tag and digest (manifest list, checked against Docker Hub on 2026-09-30).
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"  # Filebeat's Docker client asks for /info when it starts
      POST: "0"
    networks:
      - docker-api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Stand-ins for "services from your own compose project".
  # This one opts in to collection with the co.elastic.logs/enabled label.
  demo-app:
    image: busybox:1.37.0
    user: nobody
    labels:
      co.elastic.logs/enabled: "true"
    command: ["sh", "-c", "i=0; while true; do echo \"demo log line $$i\"; i=$$((i+1)); sleep 1; done"]

  # No label: its logs must NOT reach Elasticsearch.
  quiet-app:
    image: busybox:1.37.0
    user: nobody
    command: ["sh", "-c", "i=0; while true; do echo \"quiet log line $$i\"; i=$$((i+1)); sleep 1; done"]

networks:
  # Filebeat <-> docker-proxy only, no route to the outside.
  docker-api:
    internal: true

volumes:
  es-data:
  filebeat-data:
