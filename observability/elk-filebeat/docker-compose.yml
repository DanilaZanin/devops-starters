name: elk-filebeat

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      xpack.security.enabled: "true"
      # Demo shortcut: HTTP and transport TLS are off, so passwords cross the
      # docker network in clear text. Fine on one host, not on a shared network.
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u \"elastic:$${ELASTIC_PASSWORD}\" \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  # One-shot: ILM policy (7 day retention), index template, the kibana_system password
  # and a least-privilege user for Filebeat. Safe to run again.
  setup:
    build:
      context: .
      dockerfile: setup/Dockerfile
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set ELASTIC_PASSWORD in .env}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
      FILEBEAT_PASSWORD: ${FILEBEAT_PASSWORD:?set FILEBEAT_PASSWORD in .env}
    entrypoint: ["bash", "/setup.sh"]

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.4
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:?set KIBANA_PASSWORD in .env}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?set KIBANA_ENCRYPTION_KEY in .env}
    ports:
      - "127.0.0.1:5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -I http://localhost:5601 | grep -q 'HTTP/1.1 302 Found'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  filebeat:
    build:
      context: .
      dockerfile: filebeat/Dockerfile
      args:
        # Lets the smoke test build the broken config.
        FILEBEAT_CONFIG: ${FILEBEAT_CONFIG:-filebeat/filebeat.yml}
    # Root is required to read other containers' log files and the Docker socket.
    # This is the one service here that cannot run unprivileged.
    user: root
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      FILEBEAT_PASSWORD: ${FILEBEAT_PASSWORD:?set FILEBEAT_PASSWORD in .env}
    volumes:
      - filebeat-data:/usr/share/filebeat/data
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD-SHELL", "filebeat test output > /dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # Stand-ins for "services from your own compose project".
  # This one opts in to collection with the co.elastic.logs/enabled label.
  demo-app:
    image: busybox:1.37
    user: nobody
    labels:
      co.elastic.logs/enabled: "true"
    command: ["sh", "-c", "i=0; while true; do echo \"demo log line $$i\"; i=$$((i+1)); sleep 1; done"]

  # No label: its logs must NOT reach Elasticsearch.
  quiet-app:
    image: busybox:1.37
    user: nobody
    command: ["sh", "-c", "i=0; while true; do echo \"quiet log line $$i\"; i=$$((i+1)); sleep 1; done"]

volumes:
  es-data:
  filebeat-data:
