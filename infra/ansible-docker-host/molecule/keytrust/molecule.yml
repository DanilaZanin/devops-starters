---
# The Docker apt key handling: a bundle with the real Docker key plus a foreign key
# must produce a keyring with ONLY the Docker key; a wrong fingerprint must fail.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: ubuntu-2404-${MOLECULE_RUN:-local}
    image: ubuntu:24.04
    buildargs:
      BASE: ubuntu:24.04@sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3
    dockerfile: ../shared/Dockerfile.j2
    pre_build_image: false
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
    ANSIBLE_COLLECTIONS_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.collections:~/.ansible/collections:/usr/share/ansible/collections"
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
