---
# Users to add to the docker group so they can run docker without sudo.
docker_bootstrap_users: []

# Docker apt repository. The fingerprint is checked before the key is trusted.
# Source: https://docs.docker.com/engine/install/ubuntu/ ("Docker Release (CE deb)").
docker_bootstrap_gpg_key_url: https://download.docker.com/linux/ubuntu/gpg
docker_bootstrap_gpg_fingerprint: "9DC858229FC7DD38854AE2D88D81803C0EBFCD88"

# Map of `ansible_facts['architecture']` to the name Docker and node_exporter use.
docker_bootstrap_arch_map:
  x86_64: amd64
  aarch64: arm64

# node_exporter
docker_bootstrap_node_exporter_version: "1.12.1"
docker_bootstrap_node_exporter_port: 9100
# Only these CIDRs get through the firewall to the exporter port.
# Point this at your monitoring server/subnet, not 0.0.0.0/0.
docker_bootstrap_node_exporter_allowed_cidrs:
  - "10.0.0.0/8"

# ufw. The SSH port is always opened (see docker_bootstrap_ssh_port) so the
# firewall and sshd can never disagree and lock you out.
docker_bootstrap_firewall_enabled: true
docker_bootstrap_firewall_extra_tcp_ports: []

# SSH hardening (written to a drop-in that sorts before 50-cloud-init.conf)
docker_bootstrap_ssh_port: 22
docker_bootstrap_ssh_disable_password_auth: true
docker_bootstrap_ssh_disable_root_login: true
docker_bootstrap_ssh_dropin_name: 00-hardening.conf
