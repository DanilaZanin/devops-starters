---
# sshd uses the FIRST value it reads for most keywords, and Ubuntu's
# /etc/ssh/sshd_config starts with `Include /etc/ssh/sshd_config.d/*.conf`.
# Cloud images ship /etc/ssh/sshd_config.d/50-cloud-init.conf with
# `PasswordAuthentication yes`, so editing sshd_config itself does nothing.
# Files in the directory are read in lexical order: 00-hardening.conf wins.

# Ubuntu 24.04 starts sshd through ssh.socket. Its sshd-socket-generator turns
# `Port` from sshd_config(.d) into /run/systemd/generator/ssh.socket.d/addresses.conf,
# but only when systemd re-runs generators (daemon-reload) and ssh.socket is
# restarted. A plain `restart ssh` keeps the old listener.
- name: Check whether ssh.socket activation is in use
  ansible.builtin.systemd_service:
    name: ssh.socket
  register: docker_bootstrap_ssh_socket
  failed_when: false
  check_mode: false

- name: Create the sshd privilege separation directory (sshd -t needs it)
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: "/etc/ssh/sshd_config.d/{{ docker_bootstrap_ssh_dropin_name }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

# Do not trust the file: ask sshd what it will actually use.
- name: Read the effective sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: docker_bootstrap_sshd_effective
  changed_when: false
  check_mode: false

- name: Check the effective sshd configuration
  ansible.builtin.assert:
    that:
      - >-
        not (docker_bootstrap_ssh_disable_password_auth | bool)
        or 'passwordauthentication no' in docker_bootstrap_sshd_effective.stdout_lines
      - >-
        not (docker_bootstrap_ssh_disable_root_login | bool)
        or 'permitrootlogin no' in docker_bootstrap_sshd_effective.stdout_lines
      - ('port ' ~ docker_bootstrap_ssh_port) in docker_bootstrap_sshd_effective.stdout_lines
    fail_msg: >-
      sshd -T does not show the hardened values. Another file (or an earlier
      Include) overrides {{ docker_bootstrap_ssh_dropin_name }}; inspect
      /etc/ssh/sshd_config.d/ and the top of /etc/ssh/sshd_config.
    quiet: true

# Apply the restart now and prove the listener moved BEFORE the firewall role
# part runs. If it did not, stop here: ufw is untouched and the old port works.
- name: Apply pending sshd changes now
  ansible.builtin.meta: flush_handlers

- name: Wait for sshd to listen on the configured port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ docker_bootstrap_ssh_port | int }}"
    timeout: "{{ docker_bootstrap_ssh_listen_timeout | int }}"
    msg: >-
      SSH_PORT_NOT_LISTENING: nothing listens on port {{ docker_bootstrap_ssh_port }} after
      the sshd change. ufw was not modified, so the previous ssh port still works. If
      ssh.socket is customised (ListenStream in /etc/systemd/system/ssh.socket.d), align it
      with docker_bootstrap_ssh_port or disable socket activation.

# An open port is not proof that it is SSH: with ssh.socket still on 22, some other
# process may hold the new port. Require a host key served there that matches one of
# this host's own /etc/ssh/ssh_host_*_key.pub, so ufw never closes the working port.
- name: Prove the listener on the configured port is this host's sshd
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      ssh-keyscan -T 5 -p {{ docker_bootstrap_ssh_port | int }} 127.0.0.1 2>/dev/null \
        | awk '!/^#/ && NF >= 3 {print $3}' \
        | { while read -r key; do
              [ -n "$key" ] && grep -qsF -- "$key" /etc/ssh/ssh_host_*_key.pub && exit 0
            done; exit 1; }
  register: docker_bootstrap_sshd_hostkey
  changed_when: false
  failed_when: false
  check_mode: false
  retries: 3
  delay: 2
  until: docker_bootstrap_sshd_hostkey.rc == 0

- name: Stop if the listener is not sshd
  ansible.builtin.assert:
    that: docker_bootstrap_sshd_hostkey.rc == 0
    fail_msg: >-
      SSH_PORT_NOT_SSHD: port {{ docker_bootstrap_ssh_port }} is open but does not present
      a host key of this machine's sshd (another process holds it, or ssh.socket is still
      on the old port). ufw was not modified, so the previous ssh port still works.
    quiet: true
