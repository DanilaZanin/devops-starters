---
- name: Refuse to run on unsupported systems
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] in ['22.04', '24.04']
      - ansible_facts['architecture'] in docker_bootstrap_arch_map
    fail_msg: >-
      docker_bootstrap supports Ubuntu 22.04/24.04 on x86_64 and aarch64 only
      (got {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      on {{ ansible_facts['architecture'] }}).
    quiet: true
  tags: [always]

- name: Install Docker Engine
  ansible.builtin.import_tasks: docker.yml
  tags: [docker]

- name: Install node_exporter
  ansible.builtin.import_tasks: node_exporter.yml
  tags: [monitoring]

# sshd first, firewall second: ufw is only touched after sshd is confirmed to
# listen on docker_bootstrap_ssh_port, so a port that never comes up cannot
# lock you out (ssh_hardening.yml fails before the firewall changes).
- name: Harden sshd
  ansible.builtin.import_tasks: ssh_hardening.yml
  tags: [ssh]

- name: Configure the firewall
  ansible.builtin.import_tasks: firewall.yml
  tags: [firewall]
