---
- name: gather minimal facts if not already present
  setup:
    gather_subset:
      - "!all"
      - "distribution"
      - "architecture"
  when: ansible_distribution is not defined

- import_tasks: docker.yml
  tags: [docker]

- import_tasks: node_exporter.yml
  tags: [monitoring]

- import_tasks: firewall.yml
  tags: [firewall]

- import_tasks: ssh_hardening.yml
  tags: [ssh]
