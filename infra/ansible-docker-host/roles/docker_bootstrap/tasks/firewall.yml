---
# NOTE: ufw does not filter ports published by `docker run -p` / compose,
# because Docker writes its own iptables rules ahead of ufw's. See the
# README section "Docker publish bypasses ufw" before trusting this firewall
# for containers.

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    cache_valid_time: 3600

- name: Default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

# Always the same variable sshd is configured with: the firewall and sshd
# cannot disagree about the SSH port.
- name: Allow the ssh port
  community.general.ufw:
    rule: allow
    port: "{{ docker_bootstrap_ssh_port | string }}"
    proto: tcp

- name: Allow extra admin-facing tcp ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ docker_bootstrap_firewall_extra_tcp_ports }}"

- name: Allow node_exporter only from the monitoring CIDRs
  community.general.ufw:
    rule: allow
    port: "{{ docker_bootstrap_node_exporter_port | string }}"
    proto: tcp
    src: "{{ item }}"
  loop: "{{ docker_bootstrap_node_exporter_allowed_cidrs }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
  when: docker_bootstrap_firewall_enabled | bool
