---
# Installs Docker Engine from the official repo, not the (usually stale)
# distro package, and refuses to trust the repo key unless its fingerprint
# matches docker_bootstrap_gpg_fingerprint,
# and puts ONLY that key into the keyring that apt's signed-by points at.

# A source line that points at another keyring (for example docker.asc from an
# older run of this role) makes apt refuse every source: "Conflicting values
# set for option Signed-By". Drop such lines before adding ours.
- name: Remove docker apt source lines that trust another keyring
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/docker.list
    regexp: '^deb (?!.*signed-by={{ docker_bootstrap_keyring | regex_escape }}\]).*download\.docker\.com/linux/ubuntu'
    state: absent

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Trust only the verified Docker apt key
  ansible.builtin.import_tasks: docker_key.yml

- name: Add docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_bootstrap_arch_map[ansible_facts['architecture']] }}
      signed-by={{ docker_bootstrap_keyring }}]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present

- name: Install docker engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    cache_valid_time: 3600

- name: Make sure docker is enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_bootstrap_users }}"
