---
# THE TRAP. This is the "obvious" way to harden sshd, and what many roles
# (including the first version of this one) do: edit /etc/ssh/sshd_config.
# It passes `sshd -t`, reports changed=1 and looks fine in the play recap, but
# on a cloud image /etc/ssh/sshd_config.d/50-cloud-init.conf is included first
# and sshd keeps the first value it reads, so PasswordAuthentication stays yes.
#
# Only used by molecule/broken. Never import this from the role.
- name: Disable password authentication in sshd_config (does not work on cloud images)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    validate: "/usr/sbin/sshd -t -f %s"

- name: Disable root login in sshd_config (does not work on cloud images)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    validate: "/usr/sbin/sshd -t -f %s"
