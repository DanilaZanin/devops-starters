name: kafka-spark-pipeline

# lab level: every PR gets the static checks; the full smoke run (about ten minutes,
# pulls several large images) runs weekly and on demand.
on:
  pull_request:
    paths:
      - "data/kafka-spark-pipeline/**"
      - ".github/workflows/kafka-spark-pipeline.yml"
  push:
    branches: [main]
    paths:
      - "data/kafka-spark-pipeline/**"
      - ".github/workflows/kafka-spark-pipeline.yml"
  schedule:
    - cron: "7 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kafka-spark-pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copy the module out of the repository
        run: cp -r data/kafka-spark-pipeline "$RUNNER_TEMP/module"
      - name: make lint (compose config, pinned images, loopback ports)
        run: cd "$RUNNER_TEMP/module" && make lint

  smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copy the module out of the repository
        run: cp -r data/kafka-spark-pipeline "$RUNNER_TEMP/module"
      - name: make test (in the copy)
        run: cd "$RUNNER_TEMP/module" && make test
      - name: Container logs (on failure)
        if: failure()
        run: cd "$RUNNER_TEMP/module" && docker compose logs --no-color --tail 100
      - name: make reset
        if: always()
        run: cd "$RUNNER_TEMP/module" && make reset
