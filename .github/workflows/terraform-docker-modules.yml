name: terraform-docker-modules

on:
  pull_request:
    paths:
      - "infra/terraform-docker-modules/**"
      - ".github/workflows/terraform-docker-modules.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform-docker-modules/**"
      - ".github/workflows/terraform-docker-modules.yml"
  schedule:
    - cron: "51 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      # Copies the module out of the repo so a hidden dependency on the root
      # shows up as a failure, then runs the full suite in the copy.
      - name: copy-test (make test in a copy of the module)
        run: |
          dest="$RUNNER_TEMP/terraform-docker-modules"
          cp -r infra/terraform-docker-modules "$dest"
          make -C "$dest" test

  # Weekly and on demand: apply the example on the runner's Docker daemon,
  # check it answers, and destroy it. Skipped on pull requests.
  smoke-apply:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: copy-test (make up in a copy of the module; fails unless every URL answers 200)
        run: |
          dest="$RUNNER_TEMP/terraform-docker-modules"
          cp -r infra/terraform-docker-modules "$dest"
          make -C "$dest" up

      - name: Destroy the example
        if: always()
        run: make -C "$RUNNER_TEMP/terraform-docker-modules" down || true
