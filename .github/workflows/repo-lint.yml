name: repo-lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: shellcheck
        run: git ls-files '*.sh' | xargs -r shellcheck -x -S warning
      - name: no latest tags
        run: |
          if git grep -nE '(image:|FROM)\s+\S+:latest\b' -- ':!*.md'; then
            echo "pin the tag instead of :latest"; exit 1
          fi
