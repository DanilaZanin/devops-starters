replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

containerPort: 8080

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  host: demo-app.local

# Rendered straight into an env ConfigMap so we can prove per-environment
# overrides actually flow through the pipeline (see environments/*.yaml).
env:
  APP_ENV: "base"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75
