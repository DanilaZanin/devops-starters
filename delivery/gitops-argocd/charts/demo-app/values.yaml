replicaCount: 1

image:
  repository: nginxinc/nginx-unprivileged
  # Pin an exact tag (or a digest) for real workloads.
  tag: "1.30.2-alpine"
  pullPolicy: IfNotPresent

containerPort: 8080

# nginx-unprivileged runs as uid 101.
securityContext:
  runAsUser: 101

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  host: demo-app.local

# Rendered into an env ConfigMap and injected with envFrom. Env vars are read
# once at container start, so a change only takes effect when the pod restarts:
# the Deployment carries a checksum/config annotation to force that (see README).
env:
  APP_ENV: "base"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 75

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
