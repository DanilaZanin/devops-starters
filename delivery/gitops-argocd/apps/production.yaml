apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/gitops-helm-argocd-starter.git
    targetRevision: main
    path: charts/demo-app
    helm:
      valueFiles:
        - ../../environments/production/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Production doesn't self-heal into an unreviewed state without a human
  # noticing — leave selfHeal on (drift gets reverted) but this is the file
  # you'd flip to a manual sync policy if your org wants a gate before prod.
