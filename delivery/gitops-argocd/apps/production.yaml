# Production is pinned to a git tag and synced by hand. Promote by tagging a
# commit that was already running in staging, changing targetRevision below in
# a reviewed commit, then pressing Sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: demo-app
  source:
    repoURL: https://github.com/YOUR_ORG/YOUR_REPO.git
    targetRevision: v0.2.0
    path: charts/demo-app
    helm:
      valueFiles:
        - ../../environments/production/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-app-production
  # The HPA owns the replica count; do not report drift on it.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
