apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "demo-app"
        # rendered to /vault/secrets/db-creds inside the container, nobody
        # in application code needs to know how to talk to Vault's API
        vault.hashicorp.com/agent-inject-secret-db-creds: "secret/data/demo-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "secret/data/demo-app" -}}
          DB_PASSWORD={{ .Data.data.db_password }}
          API_KEY={{ .Data.data.api_key }}
          {{- end -}}
    spec:
      serviceAccountName: demo-app
      containers:
        - name: demo-app
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
