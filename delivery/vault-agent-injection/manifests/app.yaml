# The demo application. It never talks to Vault: the injected sidecar writes
# /vault/secrets/db-creds and the app reads that file on every request. It
# returns only SHA-256 hashes of the values, so a test can prove the app saw the
# right secret without the secret ever being printed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-code
  namespace: demo-app
data:
  server.py: |
    import hashlib
    import http.server
    import json

    SECRET_FILE = "/vault/secrets/db-creds"


    def read_secrets():
        values = {}
        with open(SECRET_FILE, encoding="utf-8") as fh:
            for line in fh:
                key, sep, value = line.rstrip("\n").partition("=")
                if sep:
                    values[key] = value
        return values


    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                body = {
                    key.lower() + "_sha256": hashlib.sha256(value.encode()).hexdigest()
                    for key, value in read_secrets().items()
                }
                status = 200
            except OSError as exc:
                body = {"error": type(exc).__name__}
                status = 503
            payload = json.dumps(body).encode()
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)


    http.server.ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "demo-app"
        # Rendered to /vault/secrets/db-creds in every container of the pod.
        # The path is the KV v2 API path (secret/data/...), not the CLI path.
        vault.hashicorp.com/agent-inject-secret-db-creds: "secret/data/demo-app"
        vault.hashicorp.com/agent-inject-template-db-creds: |
          {{- with secret "secret/data/demo-app" -}}
          DB_PASSWORD={{ .Data.data.db_password }}
          API_KEY={{ .Data.data.api_key }}
          {{- end -}}
    spec:
      serviceAccountName: demo-app
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-app
          image: python:3.14-alpine
          command: ["python", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
      volumes:
        - name: code
          configMap:
            name: demo-app-code
