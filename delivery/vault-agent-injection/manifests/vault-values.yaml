# Dev-mode values for the official hashicorp/vault helm chart.
# Dev mode is unsealed automatically and keeps everything in memory —
# fine for a local demo of the injection flow, not how you'd run this
# in prod (you'd want HA mode + a real storage backend + auto-unseal).
server:
  dev:
    enabled: true
    devRootToken: "root"

injector:
  enabled: true
